<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ludo King Prank Edition</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #1e293b 0%, #090d16 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
      overflow-x: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    /* Top Banner */
    .ad-banner-top {
      width: 100%;
      height: 44px;
      background: #111827;
      border: 1px dashed #374151;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 11px;
      color: #9ca3af;
    }

    /* Ludo Classic Wooden Outer Rim */
    .ludo-frame {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #8b4513;
      padding: 10px;
      border-radius: 18px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.8), inset 0 2px 6px rgba(255,255,255,0.25);
      border: 3px solid #5c2c16;
    }

    /* 15x15 Matrix Board */
    .board {
      width: 100%;
      height: 100%;
      background: #ffffff;
      border-radius: 10px;
      display: grid;
      grid-template-columns: repeat(15, 1fr);
      grid-template-rows: repeat(15, 1fr);
      position: relative;
      border: 2px solid #222;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.4);
    }

    .cell {
      border: 0.5px solid #d1d5db;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Home Bases (6x6) */
    .home-zone {
      border: 2px solid #111;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 2;
    }

    .home-red { grid-column: 1 / 7; grid-row: 1 / 7; background: #dc2626; cursor: pointer; }
    .home-green { grid-column: 10 / 16; grid-row: 1 / 7; background: #16a34a; }
    .home-blue { grid-column: 1 / 7; grid-row: 10 / 16; background: #2563eb; }
    .home-yellow { grid-column: 10 / 16; grid-row: 10 / 16; background: #eab308; }

    .white-box {
      width: 72%;
      height: 72%;
      background: #ffffff;
      border-radius: 12px;
      border: 3px solid #111;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      padding: 6px;
      gap: 6px;
      box-shadow: inset 0 4px 10px rgba(0,0,0,0.25);
    }

    .base-slot {
      border-radius: 50%;
      border: 2px solid #ccc;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .slot-red { background: #fee2e2; }
    .slot-green { background: #dcfce7; }
    .slot-blue { background: #dbeafe; }
    .slot-yellow { background: #fef9c3; }

    /* Center Triangle Zone */
    .center-zone {
      grid-column: 7 / 10;
      grid-row: 7 / 10;
      position: relative;
      border: 1px solid #111;
      background: #1e293b;
      overflow: hidden;
    }

    .tri-red {
      position: absolute;
      top: 0; left: 0; bottom: 0; width: 50%;
      clip-path: polygon(0 0, 100% 50%, 0 100%);
      background: #dc2626;
    }
    .tri-green {
      position: absolute;
      top: 0; left: 0; right: 0; height: 50%;
      clip-path: polygon(0 0, 50% 100%, 100% 0);
      background: #16a34a;
    }
    .tri-yellow {
      position: absolute;
      top: 0; right: 0; bottom: 0; width: 50%;
      clip-path: polygon(100% 0, 0 50%, 100% 100%);
      background: #eab308;
    }
    .tri-blue {
      position: absolute;
      bottom: 0; left: 0; right: 0; height: 50%;
      clip-path: polygon(0 100%, 50% 0, 100% 100%);
      background: #2563eb;
    }

    /* Colored Tracks */
    .path-red { background: #ef4444 !important; }
    .path-green { background: #22c55e !important; }
    .path-yellow { background: #eab308 !important; }
    .path-blue { background: #3b82f6 !important; }

    .safe-star {
      font-size: 11px;
      color: #333;
      font-weight: 900;
      line-height: 1;
    }

    /* Tokens */
    .token {
      width: 78%;
      height: 78%;
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 4px 6px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.7);
      cursor: pointer;
      position: relative;
      transition: transform 0.15s ease;
      z-index: 10;
    }
    .token.t-red { background: radial-gradient(circle at 35% 35%, #ff4b4b, #991b1b); }
    .token.t-green { background: radial-gradient(circle at 35% 35%, #4ade80, #15803d); }
    .token.t-yellow { background: radial-gradient(circle at 35% 35%, #fde047, #a16207); }
    .token.t-blue { background: radial-gradient(circle at 35% 35%, #60a5fa, #1d4ed8); }

    .token.active-bounce {
      animation: bounce 0.6s infinite alternate ease-in-out;
      border-color: #facc15;
    }

    @keyframes bounce {
      0% { transform: scale(1) translateY(0); }
      100% { transform: scale(1.18) translateY(-4px); }
    }

    /* Controls Panel - Center 3D Dice */
    .controls-panel {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
      background: #111827;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid #1f2937;
    }

    .player-dock {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px;
      border-radius: 10px;
      border: 2px solid transparent;
      background: #1f2937;
    }

    .player-dock.active-turn {
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
      background: #1e293b;
    }

    .player-name {
      font-size: 12px;
      font-weight: 700;
      color: #94a3b8;
    }

    .dice-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .dice-3d {
      width: 74px;
      height: 74px;
      background: linear-gradient(145deg, #ffffff, #e6e6e6);
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 46px;
      font-weight: 900;
      color: #1e293b;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(0,0,0,0.6), inset 0 2px 4px #ffffff, inset 0 -3px 6px #cbd5e1;
      border: 3px solid #facc15;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .dice-3d:active {
      transform: scale(0.92);
    }

    .dice-rolling {
      animation: spinDice 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes spinDice {
      0% { transform: rotate(0deg) scale(0.9); }
      50% { transform: rotate(180deg) scale(1.15); }
      100% { transform: rotate(360deg) scale(1); }
    }

    .status-text {
      font-size: 13px;
      color: #38bdf8;
      font-weight: 600;
      text-align: center;
      min-height: 20px;
    }

    .btn-reward-ad {
      width: 100%;
      background: linear-gradient(135deg, #6366f1, #4338ca);
      color: #fff;
      font-weight: 700;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
    }

    /* 30-SECOND GAME LOCKER OVERLAY */
    .game-locker-modal {
      position: fixed;
      inset: 0;
      background: rgba(10, 15, 29, 0.96);
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    .locker-card {
      background: #1e293b;
      border: 2px solid #facc15;
      border-radius: 20px;
      padding: 26px 20px;
      max-width: 360px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.9);
      width: 100%;
    }

    .btn-unlock {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: #fff;
      font-weight: 800;
      border: none;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 15px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 15px rgba(239,68,68,0.5);
    }

    .btn-play-ready {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      font-weight: 800;
      border: none;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.5);
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.03); }
    }
  </style>
</head>
