<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ludo King 3D Edition</title>

  <!-- ================= MONETAG VERIFICATION ================= -->
  <meta name="monetag" content="c6daa79e3f2e3bcab64f27ed73751f18">
  <!-- ======================================================== -->

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #1b2838 0%, #0d121d 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
      overflow-x: hidden;
    }

    .main-wrapper {
      width: 100%;
      max-width: 430px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: auto 0;
    }

    /* Dedicated Ad Spaces */
    .ad-slot-top, .ad-slot-bottom {
      width: 100%;
      background: #111827;
      border: 1.5px dashed #4b5563;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 6px;
      color: #9ca3af;
      font-size: 11px;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
    }
    .ad-slot-top { height: 48px; }
    .ad-slot-bottom { height: 55px; }

    /* Wooden Ludo Board Framing */
    .ludo-frame {
      width: 100%;
      max-width: 390px;
      aspect-ratio: 1 / 1;
      background: #78350f;
      padding: 10px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.8), inset 0 3px 6px rgba(255,255,255,0.25);
      border: 4px solid #451a03;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto;
    }

    /* 15x15 Matrix Board */
    .board {
      width: 100%;
      height: 100%;
      background: #ffffff;
      border-radius: 12px;
      display: grid;
      grid-template-columns: repeat(15, 1fr);
      grid-template-rows: repeat(15, 1fr);
      position: relative;
      border: 2px solid #1c1917;
      box-shadow: inset 0 0 12px rgba(0,0,0,0.35);
    }

    .cell {
      border: 0.5px solid #d1d5db;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Home Bases (6x6) */
    .home-zone {
      border: 2px solid #111;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 2;
    }

    .home-red { grid-column: 1 / 7; grid-row: 1 / 7; background: #dc2626; cursor: pointer; }
    .home-green { grid-column: 10 / 16; grid-row: 1 / 7; background: #16a34a; }
    .home-blue { grid-column: 1 / 7; grid-row: 10 / 16; background: #2563eb; }
    .home-yellow { grid-column: 10 / 16; grid-row: 10 / 16; background: #eab308; }

    .white-box {
      width: 72%;
      height: 72%;
      background: #ffffff;
      border-radius: 12px;
      border: 3px solid #111;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      padding: 6px;
      gap: 6px;
      box-shadow: inset 0 3px 8px rgba(0,0,0,0.3);
    }

    .base-slot {
      border-radius: 50%;
      border: 2px solid #cbd5e1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .slot-red { background: #fee2e2; }
    .slot-green { background: #dcfce7; }
    .slot-blue { background: #dbeafe; }
    .slot-yellow { background: #fef9c3; }

    /* Center Triangle */
    .center-zone {
      grid-column: 7 / 10;
      grid-row: 7 / 10;
      position: relative;
      border: 1px solid #111;
      background: #1e293b;
      overflow: hidden;
    }

    .tri-red {
      position: absolute;
      top: 0; left: 0; bottom: 0; width: 50%;
      clip-path: polygon(0 0, 100% 50%, 0 100%);
      background: #dc2626;
    }
    .tri-green {
      position: absolute;
      top: 0; left: 0; right: 0; height: 50%;
      clip-path: polygon(0 0, 50% 100%, 100% 0);
      background: #16a34a;
    }
    .tri-yellow {
      position: absolute;
      top: 0; right: 0; bottom: 0; width: 50%;
      clip-path: polygon(100% 0, 0 50%, 100% 100%);
      background: #eab308;
    }
    .tri-blue {
      position: absolute;
      bottom: 0; left: 0; right: 0; height: 50%;
      clip-path: polygon(0 100%, 50% 0, 100% 100%);
      background: #2563eb;
    }

    /* Colored Tracks */
    .path-red { background: #ef4444 !important; }
    .path-green { background: #22c55e !important; }
    .path-yellow { background: #eab308 !important; }
    .path-blue { background: #3b82f6 !important; }

    .safe-star {
      font-size: 11px;
      color: #333;
      font-weight: 900;
    }

    /* Tokens / Gotiyan */
    .token {
      width: 78%;
      height: 78%;
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 4px 8px rgba(0,0,0,0.6), inset 0 2px 4px rgba(255,255,255,0.7);
      cursor: pointer;
      position: relative;
      transition: transform 0.15s ease;
      z-index: 10;
    }
    .token.t-red { background: radial-gradient(circle at 35% 35%, #ff4b4b, #991b1b); }
    .token.t-green { background: radial-gradient(circle at 35% 35%, #4ade80, #15803d); }
    .token.t-yellow { background: radial-gradient(circle at 35% 35%, #fde047, #a16207); }
    .token.t-blue { background: radial-gradient(circle at 35% 35%, #60a5fa, #1d4ed8); }

    .token.bounce {
      animation: hop 0.5s infinite alternate ease-in-out;
      border-color: #facc15;
    }
    @keyframes hop {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-5px) scale(1.15); }
    }

    /* Controls & Centered 3D Dice */
    .controls-panel {
      width: 100%;
      max-width: 390px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      background: #111827;
      padding: 12px;
      border-radius: 16px;
      border: 1px solid #1f2937;
    }

    .player-dock {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px;
      border-radius: 12px;
      background: #1e293b;
      border: 2px solid transparent;
    }
    .player-dock.active-turn {
      border-color: #38bdf8;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.4);
    }
    .player-dock span {
      font-size: 12px;
      font-weight: 700;
    }

    /* REAL 3D CUBE DICE */
    .dice-scene {
      width: 65px;
      height: 65px;
      perspective: 400px;
      cursor: pointer;
    }

    .dice-cube {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transform: translateZ(-32px) rotateX(-20deg) rotateY(-30deg);
      transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.3, 1);
    }

    .dice-face {
      position: absolute;
      width: 65px;
      height: 65px;
      background: linear-gradient(145deg, #ffffff, #ebebeb);
      border-radius: 12px;
      border: 2px solid #cbd5e1;
      box-shadow: inset 0 0 6px rgba(0,0,0,0.15);
      display: grid;
      padding: 6px;
    }

    .dot {
      width: 11px;
      height: 11px;
      background: #1e293b;
      border-radius: 50%;
      margin: auto;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.6);
    }
    .dot-red { background: #dc2626 !important; }

    /* Face Layouts */
    .face-1 { transform: rotateY(0deg) translateZ(32px); display: flex; justify-content: center; align-items: center; }
    .face-6 { transform: rotateY(180deg) translateZ(32px); grid-template-columns: 1fr 1fr; grid-template-rows: repeat(3, 1fr); }
    .face-2 { transform: rotateY(90deg) translateZ(32px); grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
    .face-5 { transform: rotateY(-90deg) translateZ(32px); grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; }
    .face-3 { transform: rotateX(90deg) translateZ(32px); grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; }
    .face-4 { transform: rotateX(-90deg) translateZ(32px); grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }

    .status-text {
      font-size: 13px;
      color: #38bdf8;
      font-weight: 600;
      text-align: center;
      min-height: 20px;
    }

    /* 30-Sec Locker Overlay */
    .game-locker-modal {
      position: fixed;
      inset: 0;
      background: rgba(10, 15, 29, 0.96);
      z-index: 999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .locker-card {
      background: #1e293b;
      border: 2px solid #facc15;
      border-radius: 18px;
      padding: 24px 18px;
      max-width: 330px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .btn-unlock {
      background: #ef4444;
      color: #fff;
      font-weight: 800;
      border: none;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
      width: 100%;
    }
    .btn-play-ready {
      background: #10b981;
      color: #fff;
      font-weight: 800;
      border: none;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>
<body>

<!-- 30-SECOND LOCK MODAL -->
<div id="gameLocker" class="game-locker-modal">
  <div class="locker-card">
    <div style="font-size: 42px; margin-bottom: 8px;">🎲🔒</div>
    <h2 style="color: #facc15; font-size: 18px; margin-bottom: 6px;">Game Locked</h2>
    <p style="color: #cbd5e1; font-size: 12px; margin-bottom: 16px;">
      Game unlock karne ke liye sponsor ad khol kar <b>30 seconds</b> check karein!
    </p>

    <button id="btnOpenAdOffer" class="btn-unlock" onclick="startOfferUnlock()">
      👉 Sponsor Ad Kholein (30s)
    </button>

    <div id="unlockCountdownBox" style="display:none; margin-top:14px;">
      <p id="unlockTimerText" style="color:#38bdf8; font-size:14px; font-weight:700;">Verifying... 30s</p>
      <div style="width:100%; background:#334155; height:8px; border-radius:4px; margin-top:8px; overflow:hidden;">
        <div id="timerBar" style="width:0%; height:100%; background:#10b981;"></div>
      </div>
    </div>

    <button id="btnPlayGame" class="btn-play-ready" style="display:none; margin-top:14px;" onclick="unlockGameBoard()">
      🎮 Ludo Shuru Karein (Unlocked)
    </button>
  </div>
</div>

<div class="main-wrapper">
  
  <!-- Top Ad Slot -->
  <div class="ad-slot-top">
    <span>📢 <b>SPONSORED TOP BANNER</b></span>
  </div>

  <div class="status-text" id="statusMessage">Player 1 (Red) ki baari! 3D Dice roll karein</div>

  <!-- Wooden Board -->
  <div class="ludo-frame">
    <div class="board" id="ludoBoard">

      <!-- RED HOME ZONE (SECRET CHEAT TRIGGER) -->
      <div class="home-zone home-red" id="redHomeZone">
        <div class="white-box">
          <div class="base-slot slot-red"><div class="token t-red" id="red_0" onclick="handleTokenClick('red', 0)"></div></div>
          <div class="base-slot slot-red"><div class="token t-red" id="red_1" onclick="handleTokenClick('red', 1)"></div></div>
          <div class="base-slot slot-red"><div class="token t-red" id="red_2" onclick="handleTokenClick('red', 2)"></div></div>
          <div class="base-slot slot-red"><div class="token t-red" id="red_3" onclick="handleTokenClick('red', 3)"></div></div>
        </div>
      </div>

      <!-- GREEN HOME -->
      <div class="home-zone home-green">
        <div class="white-box">
          <div class="base-slot slot-green"><div class="token t-green"></div></div>
          <div class="base-slot slot-green"><div class="token t-green"></div></div>
          <div class="base-slot slot-green"><div class="token t-green"></div></div>
          <div class="base-slot slot-green"><div class="token t-green"></div></div>
        </div>
      </div>

      <!-- BLUE HOME -->
      <div class="home-zone home-blue"><div class="white-box"></div></div>

      <!-- YELLOW HOME -->
      <div class="home-zone home-yellow">
        <div class="white-box">
          <div class="base-slot slot-yellow"><div class="token t-yellow" id="yellow_0" onclick="handleTokenClick('yellow', 0)"></div></div>
          <div class="base-slot slot-yellow"><div class="token t-yellow" id="yellow_1" onclick="handleTokenClick('yellow', 1)"></div></div>
          <div class="base-slot slot-yellow"><div class="token t-yellow" id="yellow_2" onclick="handleTokenClick('yellow', 2)"></div></div>
          <div class="base-slot slot-yellow"><div class="token t-yellow" id="yellow_3" onclick="handleTokenClick('yellow', 3)"></div></div>
        </div>
      </div>

      <!-- CENTER ZONE -->
      <div class="center-zone">
        <div class="tri-red"></div>
        <div class="tri-green"></div>
        <div class="tri-yellow"></div>
        <div class="tri-blue"></div>
      </div>

    </div>
  </div>

  <!-- Controls Panel with 3D Dice -->
  <div class="controls-panel">
    <div class="player-dock active-turn" id="dockRed">
      <span style="color:#ef4444;">🔴 P1 (Red)</span>
    </div>

    <!-- 3D CUBE DICE -->
    <div class="dice-scene" onclick="rollDice()">
      <div class="dice-cube" id="diceCube">
        <div class="dice-face face-1"><div class="dot dot-red" style="width:16px; height:16px;"></div></div>
        <div class="dice-face face-6">
          <div class="dot"></div><div class="dot"></div>
          <div class="dot"></div><div class="dot"></div>
          <div class="dot"></div><div class="dot"></div>
        </div>
        <div class="dice-face face-2">
          <div class="dot" style="grid-column:1; grid-row:1;"></div>
          <div class="dot" style="grid-column:2; grid-row:2;"></div>
        </div>
        <div class="dice-face face-5">
          <div class="dot" style="grid-column:1; grid-row:1;"></div>
          <div class="dot" style="grid-column:3; grid-row:1;"></div>
          <div class="dot" style="grid-column:2; grid-row:2;"></div>
          <div class="dot" style="grid-column:1; grid-row:3;"></div>
          <div class="dot" style="grid-column:3; grid-row:3;"></div>
        </div>
        <div class="dice-face face-3">
          <div class="dot" style="grid-column:1; grid-row:1;"></div>
          <div class="dot" style="grid-column:2; grid-row:2;"></div>
          <div class="dot" style="grid-column:3; grid-row:3;"></div>
        </div>
        <div class="dice-face face-4">
          <div class="dot"></div><div class="dot"></div>
          <div class="dot"></div><div class="dot"></div>
        </div>
      </div>
    </div>

    <div class="player-dock" id="dockYellow">
      <span style="color:#eab308;">🟡 P2 (Yellow)</span>
    </div>
  </div>

  <!-- Bottom Ad Slot -->
  <div class="ad-slot-bottom">
    <span>📢 <b>SPONSORED REWARD AREA</b></span>
  </div>

</div>

<script>
  // ==========================================
  // SIRF 1 BAAR AD DIKHANE KA LOGIC
  // ==========================================
  const MONETAG_SCRIPT_URL = "https://quge5.com/88/tag.min.js";

  function injectMonetagOnce() {
    if (!sessionStorage.getItem("monetagLoaded")) {
      const script = document.createElement("script");
      script.src = MONETAG_SCRIPT_URL;
      script.dataset.zone = "304727";
      script.async = true;
      document.head.appendChild(script);
      sessionStorage.setItem("monetagLoaded", "true");
    }
  }

  // ==========================================
  // WEB AUDIO (Rattle Sound + Puk Puk)
  // ==========================================
  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playDiceRollSound() {
    const ctx = getAudioCtx();
    for (let i = 0; i < 5; i++) {
      setTimeout(() => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(180 + Math.random() * 220, ctx.currentTime);
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.06);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.06);
      }, i * 75);
    }
  }

  function playGotiPukSound() {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(450, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(140, ctx.currentTime + 0.09);
    gain.gain.setValueAtTime(0.25, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.09);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.09);
  }

  // ==========================================
  // 15x15 BOARD CELLS CREATION
  // ==========================================
  const boardEl = document.getElementById("ludoBoard");
  const specialCells = {
    "1_8": "path-green", "2_8": "path-green", "3_8": "path-green", "4_8": "path-green", "5_8": "path-green", "2_9": "path-green",
    "8_1": "path-red", "8_2": "path-red", "8_3": "path-red", "8_4": "path-red", "8_5": "path-red", "7_2": "path-red",
    "9_14": "path-yellow", "8_13": "path-yellow", "8_12": "path-yellow", "8_11": "path-yellow", "8_10": "path-yellow", "8_9": "path-yellow",
    "14_7": "path-blue", "13_8": "path-blue", "12_8": "path-blue", "11_8": "path-blue", "10_8": "path-blue", "9_8": "path-blue"
  };
  const starCells = ["7_2", "2_9", "9_14", "14_7", "3_7", "7_13", "13_9", "9_3"];

  for (let r = 1; r <= 15; r++) {
    for (let c = 1; c <= 15; c++) {
      if ((r <= 6 && c <= 6) || (r <= 6 && c >= 10) || (r >= 10 && c <= 6) || (r >= 10 && c >= 10) || (r >= 7 && r <= 9 && c >= 7 && c <= 9)) {
        continue;
      }
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.style.gridRow = r;
      cell.style.gridColumn = c;
      const key = `${r}_${c}`;
      if (specialCells[key]) cell.classList.add(specialCells[key]);
      if (starCells.includes(key)) {
        const star = document.createElement("span");
        star.className = "safe-star";
        star.innerText = "★";
        cell.appendChild(star);
      }
      boardEl.appendChild(cell);
    }
  }

  // ==========================================
  // 30-SECOND AD LOCKER SYSTEM
  // ==========================================
  let unlockSeconds = 30;
  let unlockTimerInterval = null;

  function startOfferUnlock() {
    getAudioCtx();
    injectMonetagOnce(); // Pehli baar Monetag ad script activate hogi

    document.getElementById("btnOpenAdOffer").style.display = "none";
    document.getElementById("unlockCountdownBox").style.display = "block";

    const timerText = document.getElementById("unlockTimerText");
    const timerBar = document.getElementById("timerBar");

    let remaining = unlockSeconds;
    unlockTimerInterval = setInterval(() => {
      remaining--;
      if (timerText) timerText.innerText = `Offer Verification... ${remaining}s`;
      if (timerBar) timerBar.style.width = (((unlockSeconds - remaining) / unlockSeconds) * 100) + "%";

      if (remaining <= 0) {
        clearInterval(unlockTimerInterval);
        document.getElementById("unlockCountdownBox").style.display = "none";
        document.getElementById("btnPlayGame").style.display = "block";
      }
    }, 1000);
  }

  function unlockGameBoard() {
    playGotiPukSound();
    document.getElementById("gameLocker").style.display = "none";
  }

  // ==========================================
  // 3D DICE & PRANK TAP CHEAT
  // ==========================================
  let currentTurn = 'red';
  let isRolling = false;
  let redTapCheatCounter = 0;
  let cheatTimeout = null;

  const diceCube = document.getElementById("diceCube");
  const statusEl = document.getElementById("statusMessage");
  const dockRed = document.getElementById("dockRed");
  const dockYellow = document.getElementById("dockYellow");
  const redHomeZone = document.getElementById("redHomeZone");

  // Red Home Tap-to-Cheat (1 to 6)
  redHomeZone.addEventListener("click", (e) => {
    if (e.target.classList.contains("token")) return;
    redTapCheatCounter++;
    if (redTapCheatCounter > 6) redTapCheatCounter = 1;
    if (navigator.vibrate) navigator.vibrate(18);

    clearTimeout(cheatTimeout);
    cheatTimeout = setTimeout(() => {
      redTapCheatCounter = 0;
    }, 5000);
  });

  const cubeRotations = {
    1: { x: 0, y: 0 },
    6: { x: 0, y: 180 },
    2: { x: 0, y: -90 },
    5: { x: 0, y: 90 },
    3: { x: -90, y: 0 },
    4: { x: 90, y: 0 }
  };

  function rollDice() {
    if (isRolling) return;
    isRolling = true;
    playDiceRollSound();

    let finalRoll = Math.floor(Math.random() * 6) + 1;
    if (currentTurn === 'red' && redTapCheatCounter > 0) {
      finalRoll = redTapCheatCounter;
      redTapCheatCounter = 0;
    }

    const extraSpins = 720;
    const target = cubeRotations[finalRoll];
    diceCube.style.transform = `translateZ(-32px) rotateX(${target.x + extraSpins}deg) rotateY(${target.y + extraSpins}deg)`;

    setTimeout(() => {
      isRolling = false;
      statusEl.innerText = `${currentTurn === 'red' ? 'Player 1' : 'Player 2'} ne ${finalRoll} laya! Goti chaliye`;
      highlightGoti(currentTurn);
    }, 850);
  }

  function highlightGoti(color) {
    for (let i = 0; i < 4; i++) {
      const g = document.getElementById(`${color}_${i}`);
      if (g) g.classList.add("bounce");
    }
  }

  function handleTokenClick(color, idx) {
    if (currentTurn !== color) return;
    playGotiPukSound(); // Classic puk puk sound

    for (let i = 0; i < 4; i++) {
      const g = document.getElementById(`${color}_${i}`);
      if (g) g.classList.remove("bounce");
    }

    statusEl.innerText = `${color === 'red' ? 'Player 1' : 'Player 2'} ka token move hua!`;

    setTimeout(() => {
      currentTurn = (currentTurn === 'red') ? 'yellow' : 'red';
      dockRed.classList.toggle("active-turn", currentTurn === 'red');
      dockYellow.classList.toggle("active-turn", currentTurn === 'yellow');
      statusEl.innerText = `${currentTurn === 'red' ? 'Player 1 (Red)' : 'Player 2 (Yellow)'} ki baari!`;
    }, 800);
  }
</script>

</body>
</html>
